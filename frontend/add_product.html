<body>

    <h1>ADD PRODUCTS</h1>
        <form action="/submit-data-endpoint" method="POST">

                <label for="productName">Product Name:</label>

                <label for="cost">Cost:</label>

            </div>

            <div>
                <label for="stockQuantity">Stock Quantity:</label>
                <input type="number" id="stockQuantity" name="username" required>
            </div>



  <!-- Submit Button -->

    <button type="submit">Submit Form</button>
  </div>

</body>
